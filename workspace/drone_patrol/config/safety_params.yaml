# Safety parameters for real drone operation

swarm:
  max_drones: 6
  
safety:
  min_altitude: 1.0          # meters
  max_altitude: 50.0         # meters
  min_separation: 2.0        # minimum distance between drones (meters)
  geofence_radius: 100.0     # maximum distance from home (meters)
  max_speed: 10.0            # maximum speed (m/s)
  emergency_land_battery: 20 # battery percentage to trigger emergency landing
  
communication:
  heartbeat_timeout: 2.0     # seconds before considering drone lost
  command_retry: 3           # number of retries for failed commands
  
obstacle_avoidance:
  detection_range: 10.0      # meters
  safe_distance: 3.0         # minimum distance from obstacles
  emergency_stop_distance: 1.5  # trigger emergency stop

mission:
  pre_flight_checks: true
  require_gps_lock: true
  min_satellites: 10
  max_wind_speed: 15.0       # m/s
